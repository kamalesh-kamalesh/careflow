<!doctype html>
<html lang="en">
  <head>
    <script>
      (function() {
        window.addEventListener('unhandledrejection', function(event) {
          var msg = String(event.reason && event.reason.message || event.reason || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        });
        window.addEventListener('error', function(event) {
          var msg = String(event.message || event.error && event.error.message || '');
          if (msg.indexOf('WebSocket') !== -1 || msg.indexOf('vite') !== -1) {
            event.preventDefault();
            event.stopPropagation();
          }
        }, true);
      })();
    </script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CareFlow AI - Smart Hospital & Patient Care</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
